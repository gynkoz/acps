<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#E6B422"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background khas KasirKu -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="#0D9488" stroke-width="6"/>
  <!-- Receipt -->
  <rect x="176" y="120" width="160" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="192" y1="138" x2="320" y2="138" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="192" y1="156" x2="296" y2="156" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <!-- Cash register body -->
  <rect x="120" y="220" width="272" height="160" rx="24" fill="#134E4A" stroke="#0B3B38" stroke-width="4"/>
  <!-- Screen -->
  <rect x="144" y="236" width="224" height="56" rx="12" fill="#E2E8F0"/>
  <rect x="156" y="248" width="200" height="32" rx="6" fill="#1E293B"/>
  <text x="256" y="271" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22C55E" text-anchor="middle" letter-spacing="2">KASIRKU</text>
  <!-- Keypad -->
  <circle cx="172" cy="330" r="16" fill="#64748B"/>
  <circle cx="216" cy="330" r="16" fill="#64748B"/>
  <circle cx="260" cy="330" r="16" fill="#64748B"/>
  <circle cx="304" cy="330" r="16" fill="#D4A017"/>
  <text x="304" y="336" font-family="Arial, sans-serif" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="348" cy="330" r="16" fill="#64748B"/>
  <!-- Price badge -->
  <circle cx="388" cy="180" r="40" fill="url(#gold)"/>
  <text x="388" y="190" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1E293B" text-anchor="middle">Rp</text>
</svg>
